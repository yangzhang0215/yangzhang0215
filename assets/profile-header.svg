  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect x="790" y="0" width="410" height="300" rx="24" fill="url(#dots)"/>

  <circle cx="1020" cy="150" r="128" stroke="url(#accent)" stroke-opacity="0.2" stroke-width="1.5"/>
