<svg width="720" height="360" viewBox="0 0 720 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Zhang Zhengyang</title>
  <desc id="description">Developer, builder, and lifelong learner working with Python, AI, data, and automation.</desc>

  <defs>
    <linearGradient id="background" x1="30" y1="0" x2="680" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A2E"/>
      <stop offset="0.52" stop-color="#0B3455"/>
      <stop offset="1" stop-color="#105C66"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="80" x2="620" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="720" height="360" rx="28" fill="url(#background)"/>
  <rect x="440" width="280" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="606" cy="78" r="80" stroke="url(#accent)" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="606" cy="78" r="44" fill="#67E8F9" fill-opacity="0.08" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="606" cy="78" r="7" fill="#FFFFFF"/>

  <rect x="52" y="70" width="64" height="6" rx="3" fill="url(#accent)"/>
  <text x="52" y="150" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0.5">ZHANG</text>
  <text x="52" y="210" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0.5">ZHENGYANG</text>
  <text x="54" y="258" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">Developer · Builder · Lifelong Learner</text>
  <text x="54" y="304" fill="#D8F3FA" fill-opacity="0.82" font-family="Segoe UI, Arial, sans-serif" font-size="19">Python  ·  AI  ·  Data  ·  Automation</text>
  <rect x="54" y="329" width="310" height="2" fill="url(#accent)" opacity="0.6"/>
  <circle cx="378" cy="330" r="4" fill="#67E8F9"/>
</svg>
